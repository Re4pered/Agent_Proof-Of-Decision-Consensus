base:
  blockemulator_config: ./config.yaml
  result_dir: ./exp/agentemu-results
  # Module root of BlockEmulator-X (contains go.mod and cmd/); used to build
  # and launch the cluster when chain.enabled is true. Default: working dir.
  module_root: "."
experiment:
  seed: 20260903
  trace: ./traces/agent=100_txs=10000.jsonl
chain:
  # When true, each round's transaction plan is automatically executed on a
  # freshly launched BlockEmulator-X cluster.
  enabled: true
  run_timeout_seconds: 600
  node_exit_grace_seconds: 15
  # Optional trusted Agent public-identity snapshot and independently provisioned digest.
  # Keep these empty for legacy/optional PoAD verification.
  poad_registry_path: ""
  poad_registry_sha256: ""
  # Local-only signing service config created by: go run ./cmd/poad-decision-service -init-dir ./local-poad
  # Keep this file outside version control; it contains private signing keys.
  poad_decision_service_config_path: ""
  poad_required_votes: 2
  poad_decision_timeout_seconds: 15
  # Strict mode launches the local signing service and requires valid PoAD evidence.
  # Use only for local experiments; see docs/local-poad-decision-service.md.
  poad_required: false
loop:
  # Caps the simulation loop; 1 means a single pass over the trace. Rounds
  # beyond the first require an AgentAPI feedback implementation.
  max_rounds: 1
protocols:
  pay:
    plugin: direct-pay
  identity:
    plugin: did-simple
    contract_address: "0x0000000000000000000000000000000000000030"
